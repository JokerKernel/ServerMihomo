name: Linux Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

  build-linux:
    name: Build Linux (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: true

      - name: Generate resources
        run: GOOS=linux go generate ./internal/assets

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          ldflags="-s -w -X snailproxy/internal/version.Version=${version} -X snailproxy/internal/version.Commit=${commit} -X snailproxy/internal/version.BuildDate=${build_date}"
          go build -trimpath -ldflags="${ldflags}" -o "dist/snailproxy-linux-${GOARCH}-${version}" ./cmd/snailproxy

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: snailproxy-linux-${{ matrix.goarch }}-${{ github.ref_name }}
          path: dist/snailproxy-linux-${{ matrix.goarch }}-${{ github.ref_name }}
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum snailproxy-linux-* > "checksums_${GITHUB_REF_NAME}.txt"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
            if [ -n "$previous_tag" ]; then
              commit_range="$previous_tag..$GITHUB_REF_NAME"
              notes_start_args=(--notes-start-tag "$previous_tag")
            else
              commit_range="$GITHUB_REF_NAME"
              notes_start_args=()
            fi

            direct_commits="$(git log --no-merges --pretty='- %s (`%h`)' "$commit_range")"
            if [ -z "$direct_commits" ]; then
              direct_commits="- 无直接提交"
            fi
            notes="$(printf '## 直接提交\n\n%s\n' "$direct_commits")"

            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "$notes" \
              "${notes_start_args[@]}" \
              --repo "$GITHUB_REPOSITORY"
          fi
